{
  "listening_port": 55555,
  "storage_path": "/config/addons_config/resiliosync",
  "vendor": "docker",
  "display_new_version": false,
  "directory_root_policy": "all",
  "directory_root": "/share/resiliosync/",
  "files_default_path": "/share/resiliosync_downloads",
  "webui": {
    "listen": "0.0.0.0:8888",
    "allow_empty_password": true,
    "dir_whitelist": [
      "/share/resiliosync",
      "/share/resiliosync/folders",
      "/share/resiliosync/mounted_folders"
    ]
  }
}
