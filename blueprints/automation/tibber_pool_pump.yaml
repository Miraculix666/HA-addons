---
blueprint:
  name: Tibber Pool Pumpensteuerung (Smart)
  description: >
    Intelligente Poolsteuerung basierend auf Tibber-Preisen.
    Beachtet Jahreszeiten, Sonneneinstrahlung und Temperatur.
    Im Hochsommer wird der Tag in 8 Intervalle geteilt, um eine Mindestlaufzeit (Standard 4h)
    zu gewährleisten (mind. 15min pro Achtel). Die Pumpe läuft in den jeweils günstigsten Zeiten.
    Bei negativen Preisen wird die Pumpe sofort eingeschaltet (falls konfiguriert).
  domain: automation
  input:
    target_entity:
      name: Poolpumpe (Switch)
      description: Der Schalter für die Poolpumpe.
      selector:
        entity:
          domain: switch
    duration_hours:
      name: Mindestlaufzeit pro Tag (Stunden)
      description: Die minimale Laufzeit pro Tag (z.B. im Sommer 4h).
      default: 4.0
      selector:
        number:
          min: 1.0
          max: 24.0
          step: 0.5
          unit_of_measurement: h
          mode: slider
    season_sensor:
      name: Jahreszeiten Sensor
      description: Sensor für die aktuelle Jahreszeit (z.B. sensor.season).
      selector:
        entity:
          domain: sensor
    solar_radiation:
      name: Sonneneinstrahlung (Lux / W/m²)
      description: Sensor für die aktuelle Sonneneinstrahlung.
      selector:
        entity:
          domain: sensor
    temperature_sensor:
      name: Temperatur (Außen/Wasser)
      description: Sensor für die relevante Temperatur.
      selector:
        entity:
          domain: sensor
    notification_service:
      name: Benachrichtigungsdienst (Optional)
      description: Der notify Service, um den Plan für morgen abends zu senden (z.B. notify.mobile_app_my_phone).
      default: ""
      selector:
        text:
    temp_high:
      name: Temperatur Hochsommer
      description: Temperatur ab der Hochsommer Modus aktiv wird.
      default: 25.0
      selector:
        number:
          min: 15.0
          max: 40.0
          step: 1.0
          unit_of_measurement: °C
          mode: slider
    temp_very_high:
      name: Temperatur Sehr Hoch
      description: Temperatur für zusätzliche Laufzeit.
      default: 30.0
      selector:
        number:
          min: 20.0
          max: 45.0
          step: 1.0
          unit_of_measurement: °C
          mode: slider
    temp_low:
      name: Temperatur Niedrig
      description: Temperatur für reduzierte Laufzeit.
      default: 15.0
      selector:
        number:
          min: 5.0
          max: 25.0
          step: 1.0
          unit_of_measurement: °C
          mode: slider
    temp_very_low:
      name: Temperatur Sehr Niedrig
      description: Temperatur für stark reduzierte Laufzeit.
      default: 10.0
      selector:
        number:
          min: -5.0
          max: 20.0
          step: 1.0
          unit_of_measurement: °C
          mode: slider
    solar_threshold:
      name: Solar Schwellenwert
      description: Sonnenstrahlung für zusätzliche Laufzeit.
      default: 500.0
      selector:
        number:
          min: 100.0
          max: 1500.0
          step: 50.0
          unit_of_measurement: W/m²
          mode: slider
    negative_prices_always_on:
      name: Bei negativen Preisen immer an
      description: Schaltet die Pumpe unabhängig vom Intervall ein, wenn der Strompreis negativ ist.
      default: true
      selector:
        boolean:

    counter_entity:
      name: Zähler (Optional)
      description: Zähler, der bei jedem Lauf inkrementiert wird.
      default: ""
      selector:
        entity:
          domain: counter

mode: restart

variables:
  target_entity_var: !input target_entity
  duration_hours_var: !input duration_hours
  season_sensor_var: !input season_sensor
  solar_radiation_var: !input solar_radiation
  temperature_sensor_var: !input temperature_sensor
  negative_prices_always_on_var: !input negative_prices_always_on
  counter_entity_var: !input counter_entity

trigger:
  - platform: time_pattern
    minutes: "/15"
  - platform: homeassistant
    event: start
  - platform: event
    event_type: "tibber_force_evaluation"

action:
  - condition: template

    value_template: >-

      {{ target_entity_var is match("^switch\\.[a-z0-9_]+$") }}

  - condition: template

    value_template: >-

      {{ counter_entity_var == "" or counter_entity_var is match("^counter\\.[a-z0-9_]+$") }}

  - condition: template

    value_template: >-

      {{ season_sensor_var is match("^sensor\\.[a-z0-9_]+$") }}

  - condition: template

    value_template: >-

      {{ solar_radiation_var is match("^sensor\\.[a-z0-9_]+$") }}

  - condition: template

    value_template: >-

      {{ temperature_sensor_var is match("^sensor\\.[a-z0-9_]+$") }}
  # The actual evaluation is handed over to a pyscript because finding the cheapest 15-minute
  # block inside eight 3-hour windows over 24h dynamically from an external Tibber API using
  # just Jinja2 in YAML is too complex. We align with the existing `tibber_smart_device.yaml`.
  - action: pyscript.tibber_evaluate_pool
    data:
      target_entity: "{{ target_entity_var }}"
      hours: "{{ duration_hours_var }}"
      season_sensor: "{{ season_sensor_var }}"
      solar_radiation: "{{ solar_radiation_var }}"
      temperature_sensor: "{{ temperature_sensor_var }}"
      negative_prices_always_on: "{{ negative_prices_always_on_var }}"
      temp_high: !input temp_high
      temp_very_high: !input temp_very_high
      temp_low: !input temp_low
      temp_very_low: !input temp_very_low
      solar_threshold: !input solar_threshold
      notification_service: !input notification_service
